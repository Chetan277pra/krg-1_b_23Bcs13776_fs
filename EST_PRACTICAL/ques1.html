<!DOCTYPE html>
<html>
<head>
<style>
body { margin:0; font-family:Arial; }
nav { background:#333; padding:10px; color:#fff; }
nav label { font-size:25px; display:none; cursor:pointer; }
nav ul { margin:0; padding:0; list-style:none; display:flex; }
nav ul li a { color:#fff; padding:10px; text-decoration:none; }

#check { display:none; }

@media(max-width:600px){
  nav ul { display:none; flex-direction:column; }
  nav label { display:block; }
  #check:checked ~ ul { display:flex; }
}
</style>
</head>
<body>

<nav>
  <label for="check">&#9776;</label>
  <input type="checkbox" id="check">
  <ul>
    <li><a href="#">Home</a></li>
    <li><a href="#">About</a></li>
    <li><a href="#">Contact</a></li>
    
  </ul>
</nav>

</body>
</html>
